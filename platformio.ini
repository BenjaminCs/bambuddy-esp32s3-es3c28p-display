; Bambuddy touch display – LCDWIKI ES3C28P (ESP32-S3 N16R8, 2.8" ILI9341V + FT6336G)
;
; There is no dedicated PlatformIO board for this panel. The generic ESP32-S3 DevKitC-1
; works once flash size and PSRAM type are overridden to match the N16R8 module:
; 16 MB quad flash + 8 MB *octal* PSRAM (qio_opi). With the default memory type the
; board boot-loops as soon as PSRAM is touched.

[env]
platform = espressif32@6.9.0          ; Arduino-ESP32 2.0.17 (ESP-IDF 4.4)
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv   ; two 6.5 MB OTA slots + SPIFFS
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = post:merge_bin.py      ; also writes firmware-merged.bin
lib_deps =
    lvgl/lvgl@9.2.2
    lovyan03/LovyanGFX@1.2.7
    bblanchon/ArduinoJson@7.2.1
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1        ; Serial = the native USB port (no USB-UART chip used)
    -DLV_CONF_INCLUDE_SIMPLE           ; use include/lv_conf.h
    -Iinclude
    -Os
    ; -DDISPLAY_ROTATION=1             ; flip the picture 180° (default 3)

; First upload over USB:  pio run -e usb -t upload
[env:usb]
upload_speed = 921600

; Later over Wi-Fi:  OTA_PASSWORD=... pio run -e ota -t upload --upload-port <display IP>
; The password is OTA_PASSWORD from include/secrets.h.
[env:ota]
upload_protocol = espota
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}
